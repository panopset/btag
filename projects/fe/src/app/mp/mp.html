<form [formGroup]="userForm" (ngSubmit)="submitTheForm()">
  <label for="name">Name:&nbsp;&nbsp;</label>
  <input id="name" type="text" formControlName="name">
  <button type="submit">Submit</button>
</form>

<h1>Output</h1>

<div *ngIf="outputText">
  <p>{{ outputText }}</p>
</div>
<div *ngIf="!outputText">
  <p>Ready...</p>
</div>
